name: update

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a new zerobrew release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo zerobrewhq/zerobrew --json tagName --jq .tagName)
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if grep -qF "version \"$version\"" Formula/zerobrew.rb; then
            echo "Formula is already at $version"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Before updating the formula: setup-homebrew resets the tap's working
      # tree, which would throw the update away.
      - name: Set up Homebrew
        if: steps.release.outputs.changed == 'true'
        uses: Homebrew/actions/setup-homebrew@main

      - name: Update formula
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ steps.release.outputs.tag }}" --repo zerobrewhq/zerobrew --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          bin/update-formula "${{ steps.release.outputs.version }}" "$RUNNER_TEMP/SHA256SUMS"

      - name: Install and test
        if: steps.release.outputs.changed == 'true'
        run: |
          brew install zerobrewhq/tap/zerobrew
          brew test zerobrewhq/tap/zerobrew
          zb --version | grep -F "${{ steps.release.outputs.version }}"

      # setup-homebrew rebuilds the tap's git setup, dropping the branch's
      # upstream and the credentials actions/checkout configured, so push
      # with the token directly.
      - name: Commit
        if: steps.release.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "zerobrew ${{ steps.release.outputs.version }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
